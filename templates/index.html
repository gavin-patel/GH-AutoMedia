<!DOCTYPE html>
<html>
<head>
    <title>GH AutoMedia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #999999;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .upload-box {
            background: #1b1b1b;
            max-width: 560px;
            margin: 0 auto 30px;
            padding: 20px;
            border-radius: 16px;
        }

        .upload-box h2 {
            margin-top: 0;
            font-size: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #292929;
            color: white;
            border-radius: 10px;
            margin: 10px 0;
        }

        .upload-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-button:hover {
            background: #0069d9;
        }

        .photo-card {
            background: #1b1b1b;
            max-width: 560px;
            margin: 0 auto 30px;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .photo-container {
            background: #292929;
            padding: 15px;
            border-radius: 12px;
        }

        img {
            display: block;
            width: 100%;
            max-height: 700px;
            object-fit: contain;
            margin: 0 auto;
        }

        .photo-info {
            padding: 15px 5px 5px;
        }

        .sharpness {
            font-size: 19px;
            margin-top: 5px;
        }

        .status {
            font-size: 17px;
            margin-top: 8px;
            color: #bbbbbb;
        }

        .status strong {
            color: white;
        }

        .button-container {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .button {
            flex: 1;
            display: block;
            padding: 16px 10px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .approve {
            background: #28a745;
        }

        .approve:hover {
            background: #218838;
        }

        .reject {
            background: #dc3545;
        }

        .reject:hover {
            background: #c82333;
        }

        .empty {
            color: #888888;
            margin-top: 60px;
        }
    </style>
</head>

<body>

    <h1>GH AutoMedia</h1>

    <div class="subtitle">
        Photo Review Dashboard
    </div>

    <div class="upload-box">

        <h2>Upload Photo</h2>

        <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">

            <input
                type="file"
                name="photo"
                accept=".jpg,.jpeg,.png"
                required
            >

            <button class="upload-button" type="submit">
                UPLOAD & PROCESS
            </button>

        </form>

    </div>

    {% if photos %}

        {% for photo in photos %}

        <div class="photo-card">

            <div class="photo-container">
                <img src="{{ url_for('photo', filename=photo.filename) }}">
            </div>

            <div class="photo-info">

                <div class="sharpness">
                    Sharpness:
                    <strong>{{ photo.sharpness }}</strong>
                </div>

                <div class="status">
                    Status:
                    <strong>{{ photo.status }}</strong>
                </div>

            </div>

            <div class="button-container">

                <a class="button approve"
                   href="{{ url_for('approve', filename=photo.filename) }}">
                    ✓ APPROVE
                </a>

                <a class="button reject"
                   href="{{ url_for('reject', filename=photo.filename) }}">
                    ✕ REJECT
                </a>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            <h2>No photos waiting for review.</h2>
        </div>

    {% endif %}

</body>
</html>
